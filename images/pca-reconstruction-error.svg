<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="white"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">PCA Reconstruction Error: Modified Images</text><text x="450" y="490" text-anchor="middle" font-family="Arial" font-size="16">Image version</text><text x="28" y="260" transform="rotate(-90 28 260)" text-anchor="middle" font-family="Arial" font-size="16">Mean squared reconstruction error</text><line x1="110" y1="420" x2="840" y2="420" stroke="#333"/><line x1="110" y1="90" x2="110" y2="420" stroke="#333"/><g font-family="Arial" font-size="13" fill="#333"><text x="95" y="424" text-anchor="end">0.000</text><text x="95" y="342" text-anchor="end">0.005</text><text x="95" y="260" text-anchor="end">0.010</text><text x="95" y="178" text-anchor="end">0.015</text><text x="95" y="96" text-anchor="end">0.020</text><text x="200" y="447" text-anchor="middle">Original</text><text x="380" y="447" text-anchor="middle">Darkened</text><text x="560" y="447" text-anchor="middle">Flipped</text><text x="740" y="447" text-anchor="middle">Rotated</text></g><g fill="#2563eb"><rect x="155" y="373" width="90" height="47"/><rect x="335" y="400" width="90" height="20"/><rect x="515" y="354" width="90" height="66"/><rect x="695" y="125" width="90" height="295"/></g><g font-family="Arial" font-size="14" fill="#222" text-anchor="middle"><text x="200" y="363">0.002838</text><text x="380" y="390">0.001204</text><text x="560" y="344">0.004027</text><text x="740" y="115">0.017941</text></g><text x="450" y="515" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Higher error means poorer reconstruction under the fitted PCA model.</text></svg>